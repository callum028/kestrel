[project]
name = "kestrel-agent"
version = "0.1.0"
description = "Kestrel executor - PTYs, worktrees, and Claude Code sessions"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
# The session host: started once, left running, independent of the server.
kestrel-session-host = "kestrel_agent.__main__:main"
# Invoked by Claude Code's own hooks, once per event, from inside a task
# worktree - see kestrel_agent/kestrel_hook.py.
kestrel-hook = "kestrel_agent.kestrel_hook:main"
# Invoked by Claude itself, from inside a task worktree, to register a wait
# instead of polling for it - see kestrel_agent/kestrel_wait.py.
kestrel-wait = "kestrel_agent.kestrel_wait:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kestrel_agent"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
