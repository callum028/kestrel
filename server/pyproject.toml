[project]
name = "kestrel"
version = "0.1.0"
description = "Kestrel — always-on personal assistant and work supervisor"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Graph mail reading (kestrel.graph_mail, kestrel.mail_auth): device-code
    # auth and Graph calls. No HTML-parsing library added alongside it -
    # kestrel.graph_mail.html_to_text uses the stdlib html.parser, which is
    # enough for reading a body rather than rendering one.
    # The Notion board client is httpx directly against the REST API - no SDK,
    # matching the "one interface, ~50 lines" bias elsewhere in this codebase.
    "httpx>=0.27",
    # Co-located for v0: both halves run in WSL, so the server imports the
    # executor directly. Installed from ../agent with `pip install -e`.
    "kestrel-agent",
    # Web Push (kestrel.push): VAPID signing + aes128gcm payload encryption.
    # Both are easy to get subtly wrong by hand; this is the de facto standard
    # Python implementation of the RFC 8030/8188/8291/8292 stack.
    "pywebpush>=2.0",
    # kestrel-mcp (kestrel.brain.mcp_server): the stdio MCP server the brain's
    # headless `claude -p` calls talk to. Using the official SDK instead of
    # hand-rolling JSON-RPC-over-stdio buys the framing, capability
    # negotiation and tool-schema validation for free - the wire format is
    # not something worth re-deriving, and the SDK is a small, dependency-
    # light protocol library (see server/kestrel/brain/mcp_server.py for the
    # tool definitions themselves).
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
kestrel-mail-auth = "kestrel.mail_auth:main"
kestrel-mcp = "kestrel.brain.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kestrel"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
